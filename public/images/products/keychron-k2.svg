      <!-- Row 2 -->
      <rect x="15" y="68" width="30" height="22" rx="4" fill="url(#k2gray)"/>
      <rect x="48" y="68" width="20" height="22" rx="4"/>
      <rect x="71" y="68" width="20" height="22" rx="4"/>
      <rect x="94" y="68" width="20" height="22" rx="4"/>
