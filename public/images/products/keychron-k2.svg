      <rect x="290" y="120" width="20" height="24" rx="4"/>
      <rect x="313" y="120" width="22" height="24" rx="4"/>
    </g>
    <!-- RGB Glow Underglow Line -->
    <line x1="15" y1="160" x2="335" y2="160" stroke="#f97316" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
    <!-- Label -->
    <text x="175" y="180" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">KEYCHRON K2 V2 • 75% WIRELESS</text>
