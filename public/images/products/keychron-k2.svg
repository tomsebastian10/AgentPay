      <rect x="290" y="68" width="20" height="22" rx="4"/>
      <rect x="313" y="68" width="22" height="22" rx="4"/>

      <!-- Row 3 -->
      <rect x="15" y="94" width="38" height="22" rx="4" fill="url(#k2gray)"/>
