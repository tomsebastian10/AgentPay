<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHeadphones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgHeadphones)"/>
  <!-- Headband Arch -->
  <path d="M 120 170 C 120 80, 280 80, 280 170" fill="none" stroke="url(#metalGrad)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 140 130 C 150 95, 250 95, 260 130" fill="none" stroke="#0f172a" stroke-width="22" stroke-linecap="round"/>
  <!-- Left Earcup -->
  <ellipse cx="120" cy="180" rx="28" ry="42" fill="url(#cupGrad)" stroke="#64748b" stroke-width="3"/>
  <ellipse cx="120" cy="180" rx="18" ry="28" fill="#0f172a"/>
  <!-- Right Earcup -->
  <ellipse cx="280" cy="180" rx="28" ry="42" fill="url(#cupGrad)" stroke="#64748b" stroke-width="3"/>
  <ellipse cx="280" cy="180" rx="18" ry="28" fill="#0f172a"/>
  <!-- Accent details -->
  <circle cx="120" cy="180" r="6" fill="#38bdf8"/>
  <circle cx="280" cy="180" r="6" fill="#38bdf8"/>
  <text x="200" y="260" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">PREMIUM ANC HEADPHONES</text>
</svg>
