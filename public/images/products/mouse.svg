<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMouse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mouseBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgMouse)"/>
  <!-- Ergonomic Mouse Body -->
  <path d="M 160 80 C 130 95, 120 150, 125 210 C 130 240, 160 250, 200 250 C 240 250, 270 240, 275 210 C 280 150, 270 95, 240 80 C 215 65, 185 65, 160 80 Z" fill="url(#mouseBody)" stroke="#64748b" stroke-width="3"/>
  <!-- Thumb Rest Flange -->
  <path d="M 125 140 C 105 160, 100 190, 125 210 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Center Split Line -->
  <line x1="200" y1="70" x2="200" y2="140" stroke="#334155" stroke-width="3"/>
  <!-- Scroll Wheel -->
  <rect x="194" y="85" width="12" height="32" rx="6" fill="#0f172a" stroke="url(#glowCyan)" stroke-width="2"/>
  <!-- RGB Accent Strip -->
  <path d="M 140 180 C 170 195, 230 195, 260 180" fill="none" stroke="url(#glowCyan)" stroke-width="3" stroke-linecap="round"/>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">PRECISION ERGONOMIC MOUSE</text>
</svg>
