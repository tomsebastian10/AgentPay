<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMonitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bgMonitor)"/>
  <!-- Monitor Stand Base -->
  <ellipse cx="200" cy="245" rx="55" ry="12" fill="#334155" stroke="#475569" stroke-width="2"/>
  <!-- Stand Stem -->
  <rect x="193" y="180" width="14" height="65" rx="4" fill="#475569"/>
  <!-- Bezel -->
  <rect x="60" y="45" width="280" height="155" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Display Screen -->
  <rect x="68" y="53" width="264" height="139" rx="4" fill="url(#screenGrad)" opacity="0.9"/>
  <!-- Code/Graphic lines on screen -->
  <line x1="85" y1="75" x2="180" y2="75" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="85" y1="95" x2="240" y2="95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="115" x2="210" y2="115" stroke="#f472b6" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="100" y1="135" x2="280" y2="135" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <text x="200" y="275" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">QHD / 4K DISPLAY</text>
</svg>
